name: Custom Version - Workflow Dispatch

on:
  workflow_dispatch:
    inputs:
      version_to_patch:
        description: 'The Version You Want to Patch'
        required: true
        default: '7.7.2'
      os-and-arch:
        description: 'Operating System And Architecture'
        required: true
        type: choice
        options:
          - Windows (x86_64)
          - Linux (x86_64)
      patch-server-port:
        description: 'Patch server port (useful for resolving port conflicts)'
        required: true
        default: '5678'
      patch-user-email:
        description: 'Fake registered email (for fake FE account)'
        required: true
        default: 'long@telerik.com'
      patch-user-firstName:
        description: 'Fake registered first name (for fake FE account)'
        required: true
        default: 'Long'
      patch-user-lastName:
        description: 'Fake registered last name (for fake FE account)'
        required: true
        default: 'Wang'
      patch-user-country-code:
        description: 'Fake registered country code (for fake FE account) ; Ex: 86'
        required: true
        default: '86'
      patch-user-provider:
        description: 'Fake registered provider (for fake FE account) ; Ex: Google'
        required: true
        default: 'Google'
      patch-language:
        description: 'Enable Chinese UI'
        required: true
        type: choice
        default: 'No'
        options:
          - 'No'
          - 'Yes (Ctrl+T to toggle)'

defaults:
  run:
    shell: pwsh

env:
  # 可选：System.Linq.dll 的直链（用于后端签名公钥白名单校验）。
  # 留空则跳过这一步，补丁仍能打成功，但登录/用户数据可能校验失败。
  SYSTEM_LINQ_URL: ''
  OS_ARCH: ${{ github.event.inputs.os-and-arch }}
  VERSION_TO_PATCH: ${{ github.event.inputs.version_to_patch }}
  PATCH_SERVER_PORT: ${{ github.event.inputs.patch-server-port }}
  PATCH_USER_EMAIL: ${{ github.event.inputs.patch-user-email }}
  PATCH_USER_FNAME: ${{ github.event.inputs.patch-user-firstName }}
  PATCH_USER_LNAME: ${{ github.event.inputs.patch-user-lastName }}
  PATCH_USER_COUNTRYCODE: ${{ github.event.inputs.patch-user-country-code }}
  PATCH_USER_PROVIDER: ${{ github.event.inputs.patch-user-provider }}
  PATCH_LANGUAGE: ${{ github.event.inputs.patch-language }}

jobs:

  validate-version:
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.get_validity.outputs.is_valid }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate Fiddler Version
        id: get_validity
        working-directory: utils/fe-version-validator
        run: |
          ./Validate-FEVersion.ps1 -VersionToPatch $env:VERSION_TO_PATCH

  init_os_arch:
    runs-on: ubuntu-latest
    outputs:
      library_extension: ${{ steps.set_library_extension.outputs.library_extension }}
      arch_code: ${{ steps.set_arch.outputs.arch_code }}

    steps:
      - name: Set Library Extension (dll / so / dylib)
        id: set_library_extension
        run: |
          $extension = 'not-selected'
          if ($env:OS_ARCH -eq 'Windows (x86_64)') {
            $extension = 'dll'
          } elseif ($env:OS_ARCH -eq 'Linux (x86_64)') {
            $extension = 'so'
          } elseif ($env:OS_ARCH -like 'Mac*') {
            $extension = 'dylib'
          } else {
            throw "Unsupported OS architecture: $env:OS_ARCH"
          }
          "library_extension=$extension" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Set Arch Code
        id: set_arch
        run: |
          $arch = 'not-selected'
          if ($env:OS_ARCH -eq 'Windows (x86_64)') {
            $arch = 'win32-x86_64'
          } elseif ($env:OS_ARCH -eq 'Linux (x86_64)') {
            $arch = 'linux-x86_64'
          } elseif ($env:OS_ARCH -eq 'Mac (arm64)') {
            $arch = 'mac-arm64'
          } elseif ($env:OS_ARCH -eq 'Mac (arm64e)') {
            $arch = 'mac-arm64e'
          } elseif ($env:OS_ARCH -eq 'Mac (x86_64)') {
            $arch = 'mac-x86_64'
          } else {
            throw "Unsupported OS architecture: $env:OS_ARCH"
          }
          "arch_code=$arch" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

  download-Yui-patch:
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - init_os_arch

    if: ${{ needs.validate-version.outputs.is_valid == 'true' }}

    env:
      LIBRARY_EXTENSION: ${{ needs.init_os_arch.outputs.library_extension }}
      ARCH_CODE: ${{ needs.init_os_arch.outputs.arch_code }}

    outputs:
      Yui-fiddler-name: ${{ steps.Yui-fiddler-name.outputs.Yui-fiddler-name }}

    steps:
      - name: Compare VERSION_TO_PATCH with 5.17.0
        run: |
          $patchingVersion = $env:VERSION_TO_PATCH
          $compareVersion = "5.17.0"
          if (-not [string]::IsNullOrEmpty($patchingVersion)) {
            if ([version]$patchingVersion -ge [version]$compareVersion) {
              "IS_COMPATIBLE_CONT=true" | Out-File -Append -FilePath $env:GITHUB_ENV
            } else {
              "IS_COMPATIBLE_CONT=false" | Out-File -Append -FilePath $env:GITHUB_ENV
            }
          } else {
            "IS_COMPATIBLE_CONT=false" | Out-File -Append -FilePath $env:GITHUB_ENV
          }

      - name: Set Yui fiddler name (>= 5.17.0)
        if: env.IS_COMPATIBLE_CONT == 'true' && env.OS_ARCH != 'Linux (x86_64)'
        run: |
          "Yui_FIDDLER_NAME=fiddler.$env:LIBRARY_EXTENSION" | Out-File -Append -FilePath $env:GITHUB_ENV
          "Yui_FIDDLER_NAME_NO_EXTENSION=fiddler" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Set Yui fiddler name (< 5.17.0 or on linux)
        if: env.IS_COMPATIBLE_CONT == 'false' || env.OS_ARCH == 'Linux (x86_64)'
        run: |
          "Yui_FIDDLER_NAME=libfiddler.$env:LIBRARY_EXTENSION" | Out-File -Append -FilePath $env:GITHUB_ENV
          "Yui_FIDDLER_NAME_NO_EXTENSION=libfiddler" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Set Yui_FIDDLER_NAME as Output
        id: Yui-fiddler-name
        run: |
          "Yui-fiddler-name=$env:Yui_FIDDLER_NAME" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Create Yui directory
        run: |
          if (-not (Test-Path "Yui")) {
            New-Item -ItemType Directory -Path "Yui" -Force | Out-Null
          }

      - name: Download Yui Patch
        run: |
          $yuiName = "yui"
          $release = "continuous"
          $fileName = "$yuiName-$env:Yui_FIDDLER_NAME_NO_EXTENSION-$env:ARCH_CODE-$release.$env:LIBRARY_EXTENSION"
          $YuiFiddlerUrl = "https://github.com/project-yui/Yui-patch/releases/download/$release/$fileName"

          Write-Host "EXTENSION   = $env:LIBRARY_EXTENSION"
          Write-Host "ARCH CODE   = $env:ARCH_CODE"
          Write-Host "Download URL: $YuiFiddlerUrl"

          try {
            Invoke-WebRequest -Uri $YuiFiddlerUrl -OutFile "Yui/$env:Yui_FIDDLER_NAME"
          } catch {
            throw "下载 Yui patch 失败: $YuiFiddlerUrl`n$_"
          }

      - name: Upload Yui folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: Yui-patch
          path: Yui/
          if-no-files-found: error

  download-msojocs-server:
    runs-on: ubuntu-latest
    needs: validate-version

    if: ${{ needs.validate-version.outputs.is_valid == 'true' }}

    steps:
      - name: Set up Git
        run: |
          git init
          git remote add origin https://github.com/msojocs/fiddler-everywhere-enhance.git
          git config core.sparseCheckout true

      - name: Configure sparse-checkout to download the server directory
        run: |
          Set-Content -Path ".git/info/sparse-checkout" -Value "server"
          git pull origin main

      - name: Move the downloaded directory to the target folder
        run: |
          New-Item -ItemType Directory -Path "msojocs" -Force | Out-Null
          if (-not (Test-Path "server")) { throw "sparse-checkout 没有产出 server 目录" }
          Move-Item -Path "server" -Destination "msojocs/"

      - name: List files in the msojocs/server directory
        run: Get-ChildItem -Path msojocs\server -Depth 1

      - name: Upload msojocs folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: msojocs-patch
          path: msojocs/
          if-no-files-found: error

  download-fiddler-everywhere-windows:
    if: ${{ github.event.inputs.os-and-arch == 'Windows (x86_64)' }}
    runs-on: ubuntu-latest
    needs:
      - validate-version

    steps:
      - name: Build URL & Download
        run: |
          $patchingVersion = $env:VERSION_TO_PATCH
          if ([string]::IsNullOrEmpty($patchingVersion)) { throw "VERSION_TO_PATCH 为空" }

          $downloadUrl = "https://downloads.getfiddler.com/win/Fiddler%20Everywhere%20$patchingVersion.exe"
          Write-Host "Download URL: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "FiddlerEverywhereSetup.exe"
          Write-Host "安装包大小: $((Get-Item 'FiddlerEverywhereSetup.exe').Length) 字节"

      - name: Extract exe
        run: 7z x "FiddlerEverywhereSetup.exe" -ofe_extracted

      - name: Extract app
        run: |
          $archives = Get-ChildItem -Path "fe_extracted" -Recurse -Filter "app-*.7z"
          if (-not $archives) {
            Get-ChildItem -Path "fe_extracted" -Depth 2 | Select-Object FullName
            throw "fe_extracted 里找不到 app-*.7z"
          }
          $archive = $archives | Where-Object { $_.Name -eq "app-64.7z" } | Select-Object -First 1
          if (-not $archive) { $archive = $archives[0] }
          Write-Host "使用归档: $($archive.FullName)"
          7z x $archive.FullName -ofe_app

      - name: Upload Fiddler Everywhere Extracted folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fe_app
          path: fe_app/
          if-no-files-found: error

  download-fiddler-everywhere-linux:
    if: ${{ github.event.inputs.os-and-arch == 'Linux (x86_64)' }}
    runs-on: ubuntu-latest
    needs:
      - validate-version

    steps:
      - name: Build URL & Download
        run: |
          $patchingVersion = $env:VERSION_TO_PATCH
          if ([string]::IsNullOrEmpty($patchingVersion)) { throw "VERSION_TO_PATCH 为空" }

          $downloadUrl = "https://downloads.getfiddler.com/linux/fiddler-everywhere-$patchingVersion.AppImage"
          Write-Host "Download URL: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "FiddlerEverywhereSetup.AppImage"

      - name: Extract AppImage
        run: |
          chmod +x ./FiddlerEverywhereSetup.AppImage
          ./FiddlerEverywhereSetup.AppImage --appimage-extract

      - name: Rename squashfs-root to fe_app
        run: mv squashfs-root fe_app

      - name: Upload Fiddler Everywhere Extracted folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fe_app
          path: fe_app/
          if-no-files-found: error

  download-fiddler-everywhere-mac:
    if: ${{ github.event.inputs.os-and-arch == 'Mac (x86_64)' || github.event.inputs.os-and-arch == 'Mac (arm64)' || github.event.inputs.os-and-arch == 'Mac (arm64e)' }}
    runs-on: macos-latest
    needs:
      - validate-version
      - init_os_arch

    env:
      ARCH_CODE: ${{ needs.init_os_arch.outputs.arch_code }}

    steps:
      - name: Build URL & Download
        run: |
          $patchingVersion = $env:VERSION_TO_PATCH
          if ([string]::IsNullOrEmpty($patchingVersion)) { throw "VERSION_TO_PATCH 为空" }

          if ($env:ARCH_CODE -eq "mac-x86_64") {
            $downloadUrl = "https://downloads.getfiddler.com/mac/Fiddler%20Everywhere%20$patchingVersion.dmg"
          } elseif ($env:ARCH_CODE -eq "mac-arm64") {
            $downloadUrl = "https://downloads.getfiddler.com/mac-arm64/Fiddler%20Everywhere%20$patchingVersion.dmg"
          } else {
            throw "不支持的 macOS 架构: $env:ARCH_CODE"
          }

          Write-Host "Download URL: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "FiddlerEverywhereSetup.dmg"

      - name: Mount and extract dmg
        run: |
          hdiutil attach FiddlerEverywhereSetup.dmg
          New-Item -ItemType Directory -Path "fe_app" -Force | Out-Null
          $volume = Get-ChildItem -Path "/Volumes" -Filter "Fiddler*" -Directory | Select-Object -First 1
          if (-not $volume) { throw "找不到挂载的 Fiddler 卷" }
          Copy-Item -Path (Join-Path $volume.FullName '*') -Destination "fe_app" -Recurse -Force
          hdiutil detach $volume.FullName -Force

      - name: List fe_app
        run: Get-ChildItem -Recurse fe_app -Depth 2

      - name: Upload Fiddler Everywhere Extracted folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fe_app
          path: fe_app/
          if-no-files-found: error

  patch_fe:
    runs-on: windows-latest

    needs:
      - validate-version
      - download-Yui-patch
      - download-msojocs-server
      - download-fiddler-everywhere-windows
      - download-fiddler-everywhere-linux
      - download-fiddler-everywhere-mac

    # 只有前置任务真的成功了才打补丁。
    # 原来的 if: always() 会让这一步在上游全挂时照样执行，
    # 于是真实的失败原因被掩盖，最后在一个莫名其妙的地方报错。
    if: ${{ !cancelled() && needs.validate-version.outputs.is_valid == 'true' && needs.download-Yui-patch.result == 'success' && needs.download-msojocs-server.result == 'success' && (needs.download-fiddler-everywhere-windows.result == 'success' || needs.download-fiddler-everywhere-linux.result == 'success' || needs.download-fiddler-everywhere-mac.result == 'success') }}

    outputs:
      patched-fe-name: ${{ steps.rename-fe.outputs.patched-fe-name }}

    steps:
      - name: Download Yui Patch
        uses: actions/download-artifact@v8
        with:
          name: Yui-patch
          path: Yui-patch

      - name: Download msojocs Server
        uses: actions/download-artifact@v8
        with:
          name: msojocs-patch
          path: msojocs-patch

      - name: Download FE
        uses: actions/download-artifact@v8
        with:
          name: fe_app
          path: fe_app

      - name: List the contents of the downloaded artifacts
        run: |
          Write-Host "===== Yui-patch ====="
          Get-ChildItem -Path Yui-patch -Depth 2 | Select-Object FullName
          Write-Host "===== msojocs-patch ====="
          Get-ChildItem -Path msojocs-patch -Depth 3 | Select-Object FullName
          Write-Host "===== fe_app ====="
          Get-ChildItem -Path fe_app -Depth 2 | Select-Object FullName

      - name: Rename main FE folder
        run: |
          if (-not (Test-Path "fe_app")) {
            Get-ChildItem -Path . -Depth 2 | Select-Object FullName
            throw "fe_app 目录不存在：前置的下载/解包 job 没有产出 artifact"
          }
          Rename-Item -Path "fe_app" -NewName "FE"
          Write-Host "===== FE 顶层结构 ====="
          Get-ChildItem -Path "FE" -Depth 2 | Select-Object FullName

      # 【核心修复】原版 workflow 缺少这一步。
      # Fiddler Everywhere 的代码打包在 resources/app.asar 里，
      # 不解包就永远没有 resources/app/out/main.js。
      - name: Unpack app.asar
        run: |
          $resources = "FE/resources"
          $appDir    = Join-Path $resources "app"
          $asar      = Join-Path $resources "app.asar"
          $unpacked  = Join-Path $resources "app.asar.unpacked"

          if (-not (Test-Path $resources)) {
            Get-ChildItem -Path "FE" -Depth 2 | Select-Object FullName
            throw "找不到 FE/resources 目录"
          }

          if (Test-Path $appDir) {
            Write-Host "resources/app 已存在，跳过解包"
          }
          else {
            if (-not (Test-Path $asar)) {
              Write-Host "===== resources 实际结构 ====="
              Get-ChildItem -Path $resources -Depth 2 | Select-Object FullName
              throw "resources 下既没有 app 目录，也没有 app.asar"
            }

            # 官方说明：解包前在 app.asar.unpacked 里放一个空的 NOTICES-reporter.txt
            if (Test-Path $unpacked) {
              $notice = Join-Path $unpacked "NOTICES-reporter.txt"
              if (-not (Test-Path $notice)) {
                New-Item -ItemType File -Path $notice -Force | Out-Null
              }
            }

            Write-Host "开始解包 app.asar -> app（视体积可能需要一两分钟）"
            npx --yes "@electron/asar" extract $asar $appDir
            if ($LASTEXITCODE -ne 0) {
              throw "asar extract 失败（退出码 $LASTEXITCODE）。若报路径过长，可尝试在 Linux 任务里解包后再传 artifact"
            }

            # 解包后必须删掉 asar，否则 Electron 仍会优先加载旧归档
            Remove-Item -Path $asar -Force
            Write-Host "app.asar 已删除"
          }

          $mainJs = Join-Path $appDir "out/main.js"
          if (-not (Test-Path $mainJs)) {
            Write-Host "===== app 实际结构 ====="
            Get-ChildItem -Path $appDir -Depth 2 | Select-Object FullName
            throw "解包后仍找不到 app/out/main.js"
          }
          Write-Host "OK -> $mainJs"

      - name: Patch fiddler.dll / libfiddler.dll
        run: |
          $yuiName = "${{ needs.download-Yui-patch.outputs.Yui-fiddler-name }}"
          if ([string]::IsNullOrEmpty($yuiName)) {
            throw "Yui-fiddler-name 为空，检查 download-Yui-patch 的输出"
          }

          $original_fiddler = "FE/$yuiName"
          $Yui_fiddler = "Yui-patch/$yuiName"

          if ((Test-Path $original_fiddler) -and (Test-Path $Yui_fiddler)) {
            Copy-Item -Path $Yui_fiddler -Destination $original_fiddler -Force
            Write-Host "Replaced $original_fiddler with $Yui_fiddler"
          } else {
            Write-Host "未找到 $original_fiddler 或 $Yui_fiddler，跳过库替换"
          }

      - name: Clean Yui-patch
        run: |
          if (Test-Path "Yui-patch") { Remove-Item -Path "Yui-patch" -Recurse -Force }

      - name: Copy Server Folder
        run: |
          $src = "msojocs-patch/server/file"
          $dst = "FE/resources/app/out/file"

          if (-not (Test-Path $src)) {
            Write-Host "===== msojocs-patch 实际结构 ====="
            Get-ChildItem -Path "msojocs-patch" -Depth 3 | Select-Object FullName
            throw "msojocs-patch/server/file 不存在"
          }

          # 关键修复：先把目标目录建出来，再复制内容。
          # 若目标目录不存在，Copy-Item 会把 file 这层"重命名"掉，
          # 导致真实路径变成 out/xxx 而不是 out/file/xxx。
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Recurse -Force

          $probe = Join-Path $dst 'identity.getfiddler.com/oauth/token.json'
          if (-not (Test-Path $probe)) {
            Write-Host "===== FE/resources/app/out 实际结构 ====="
            Get-ChildItem -Path "FE/resources/app/out" -Depth 3 | Select-Object FullName
            throw "复制完成后仍找不到 token.json"
          }
          Write-Host "OK -> $probe"

      - name: Enable Chinese translation
        if: startsWith(env.PATCH_LANGUAGE, 'Yes')
        run: |
          $translate_js = "msojocs-patch/server/translate.js"
          $dest_translate = "FE/resources/app/out/translate.js"
          if (Test-Path $translate_js) {
            Copy-Item -Path $translate_js -Destination $dest_translate -Force
            Write-Host "translate.js copied, Chinese language enabled (Ctrl+T to switch)"
          } else {
            Write-Host "translate.js not found in server directory"
          }

      - name: Set patch server port (index.js)
        run: |
          $source_index = "msojocs-patch/server/index.js"
          if (-not (Test-Path $source_index)) { throw "index.js 不存在: $source_index" }

          $index_content = Get-Content -Path $source_index -Raw
          $index_content = $index_content -replace 'const port = \d+;', "const port = $env:PATCH_SERVER_PORT;"
          Set-Content -Path $source_index -Value $index_content -Encoding utf8
          Write-Host "Server port set to $env:PATCH_SERVER_PORT"

      - name: Set user credentials
        run: |
          $source_json = "FE/resources/app/out/file/identity.getfiddler.com/oauth/token.json"

          if (-not (Test-Path $source_json)) {
            Write-Host "===== FE/resources/app/out 实际结构 ====="
            Get-ChildItem -Path "FE/resources/app/out" -Depth 3 | Select-Object FullName
            throw "token.json 不存在: $source_json"
          }

          $main_content = Get-Content -Path $source_json -Raw | ConvertFrom-Json
          $main_content.user_info.email = $env:PATCH_USER_EMAIL
          $main_content.user_info.firstName = $env:PATCH_USER_FNAME
          $main_content.user_info.lastName = $env:PATCH_USER_LNAME
          $main_content.user_info.country = $env:PATCH_USER_COUNTRYCODE
          $main_content.user_info.identities[0].providerName = $env:PATCH_USER_PROVIDER

          # Depth 必须够大，否则超出层级的嵌套对象会被压成 "@{...}" 字符串
          $main_content | ConvertTo-Json -Depth 100 | Set-Content -Path $source_json -Encoding utf8
          Write-Host "Credentials patched -> $source_json"

      - name: Patch main.js to main.original.js
        run: |
          $source_main = "FE/resources/app/out/main.js"
          $new_main = "FE/resources/app/out/main.original.js"
          $source_index = "msojocs-patch/server/index.js"

          if (-not (Test-Path $source_main)) { throw "main.js 不存在: $source_main" }
          if (-not (Test-Path $source_index)) { throw "index.js 不存在: $source_index" }

          Copy-Item -Path $source_main -Destination $new_main -Force

          $main_content = Get-Content -Path $source_main -Raw
          $index_content = Get-Content -Path $source_index -Raw

          $appended_content = $index_content + "`n" + $main_content
          Set-Content -Path $source_main -Value $appended_content -Encoding utf8
          Write-Host "main.js patched (index.js 已前置拼接)"

      - name: Patch System.Linq.dll (optional)
        continue-on-error: true
        run: |
          $dest = "FE/resources/app/out/WebServer/System.Linq.dll"

          if ([string]::IsNullOrWhiteSpace($env:SYSTEM_LINQ_URL)) {
            Write-Host "::warning::SYSTEM_LINQ_URL 未配置，跳过 System.Linq.dll 替换"
            return
          }
          if (-not (Test-Path (Split-Path $dest))) {
            Write-Host "::warning::WebServer 目录不存在，跳过 System.Linq.dll 替换"
            return
          }

          Invoke-WebRequest -Uri $env:SYSTEM_LINQ_URL -OutFile $dest -Force
          Write-Host "System.Linq.dll 已替换 -> $dest"

      - name: Clean msojocs-patch
        run: |
          if (Test-Path "msojocs-patch") { Remove-Item -Path "msojocs-patch" -Recurse -Force }

      - name: Rename FE
        id: rename-fe
        run: |
          if (-not (Test-Path "FE")) { throw "FE 目录不存在，无法重命名" }

          $newName = "Fiddler-Everywhere-V${env:VERSION_TO_PATCH}-Patched"
          Rename-Item -Path "FE" -NewName $newName

          "patched-fe-name=$newName" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host "Renamed to $newName"

      - name: Upload Artifact for Patched FE
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.rename-fe.outputs.patched-fe-name }}"
          path: "${{ steps.rename-fe.outputs.patched-fe-name }}/"
          if-no-files-found: error
